<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Image Slider</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .slider {
            position: relative;
            width: 400px;
            height: 400px;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            color: #333;
            text-decoration: none;
            background: #fff;
            padding: 5px 10px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        #left {
            left: 10px;
        }

        #right {
            right: 10px;
        }
    </style>
</head>

<body>

    <a href="#" class="arrow" id="left">&#8592;</a>
    <div class="slider">
        <img id="slideImage" src="" alt="Image Slider">
    </div>
    <a href="#" class="arrow" id="right">&#8594;</a>

</body>
<script src="may29_3.js"></script>

</html>
