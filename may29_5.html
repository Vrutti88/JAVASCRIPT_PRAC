<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Menu</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #2c3e50;
            color: white;
            padding-top: 60px;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.2);
        }

        /* THIS WAS MISSING */
        .sidebar.show {
            left: 0;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-left: 4px solid transparent;
            transition: background 0.3s, border-left-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
            border-left-color: #00bcd4;
        }

        .sidebar a span.icon {
            margin-right: 12px;
            font-size: 22px;
        }

        /* Toggle button style */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            z-index: 1100;
            width: 200px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s;
        }

        .toggle-btn:hover {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button class="toggle-btn" id="toggleBtn">&#9776; Menu</button>

    <div class="sidebar" id="sidebar">
        <a href="#"><span class="icon">🏠</span> Home</a>
        <a href="#"><span class="icon">ℹ️</span> About</a>
        <a href="#"><span class="icon">🛠️</span> Services</a>
        <a href="#"><span class="icon">📞</span> Contact</a>
    </div>

    <script src="may29_5.js"></script>

</body>

</html>
