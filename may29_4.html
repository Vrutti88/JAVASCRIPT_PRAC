<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
    }

    nav {
      background-color: #1e1e2f;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      transition: max-height 0.3s ease;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 17px;
      position: relative;
      transition: color 0.2s ease;
    }

    .nav-links a::after {
      content: "";
      height: 2px;
      background: #00bcd4;
      width: 0;
      position: absolute;
      left: 0;
      bottom: -4px;
      transition: width 0.3s ease-in-out;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .toggle-btn {
      font-size: 28px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 768px) {
      .toggle-btn {
        display: block;
      }

      .nav-links {
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background-color: #1e1e2f;
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.3s ease;
      }

      .nav-links.show {
        max-height: 250px;
        padding: 10px 0;
      }

      .nav-links a {
        padding: 12px 0;
        text-align: center;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">Hello</div>
    <button class="toggle-btn" id="toggleBtn">&#9776;</button>
    <div class="nav-links" id="navLinks">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </div>
  </nav>

</body>
<script src="may29_4.js"></script>
</html>
